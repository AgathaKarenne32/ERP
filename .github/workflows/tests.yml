name: Tests

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  test-ecletica-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        working-directory: ecletica/api
        run: pip install -r requirements.txt

      - name: Rodar testes
        working-directory: ecletica/api
        run: pytest -v

  test-anotaai-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        working-directory: anotaai/api
        run: pip install -r requirements.txt

      - name: Rodar testes
        working-directory: anotaai/api
        run: pytest -v
