services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ecletica
      POSTGRES_PASSWORD: ecletica
      POSTGRES_DB: ecletica
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-anotaai-db.sh:/docker-entrypoint-initdb.d/init-anotaai-db.sh
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecletica"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  ecletica-api:
    build: ./ecletica/api
    env_file:
      - .env
    environment:
      ECLETICA_DATABASE_URL: postgresql+psycopg://ecletica:ecletica@postgres:5432/ecletica
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  anotaai-api:
    build: ./anotaai/api
    env_file:
      - .env
    environment:
      ANOTAAI_DATABASE_URL: postgresql+psycopg://ecletica:ecletica@postgres:5432/anotaai
      ANOTAAI_ECLETICA_API_URL: http://ecletica-api:8000
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  anotaai-worker:
    build: ./anotaai/worker
    env_file:
      - .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      ANOTAAI_API_URL: http://anotaai-api:8000
    depends_on:
      redis:
        condition: service_started
      anotaai-api:
        condition: service_healthy

volumes:
  postgres_data:
