{% extends "admin/base.html" %}
{% block titulo %}Login — Painel Eclética{% endblock %}
{% block conteudo %}
<div class="card" style="max-width: 360px; margin: 3rem auto;">
  <h1 style="font-size: 1.25rem;">Entrar</h1>
  {% if erro %}<p class="erro">{{ erro }}</p>{% endif %}
  <form method="post" action="/admin/login" style="display: flex; flex-direction: column; gap: 0.75rem;">
    <label>
      Email
      <input type="email" name="email" required autofocus>
    </label>
    <label>
      Senha
      <input type="password" name="senha" required>
    </label>
    <button type="submit">Entrar</button>
  </form>
</div>
{% endblock %}
